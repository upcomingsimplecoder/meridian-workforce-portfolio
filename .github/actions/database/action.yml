name: Isolated database
description: Migrate, seed and provision least-privilege identities on this runner's PostgreSQL.
inputs:
  roundtrip:
    description: Also verify migration down/up and schema drift.
    default: "false"
  test-database:
    description: Also prepare the isolated API integration database.
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare the ephemeral service
      shell: bash
      run: |
        .venv/bin/python scripts/ci_bootstrap.py
        .venv/bin/python -m scripts.operator_db upgrade
    - name: Migration roundtrip and schema check
      if: inputs.roundtrip == 'true'
      shell: bash
      run: |
        .venv/bin/python -m scripts.operator_db downgrade
        .venv/bin/python -m scripts.operator_db upgrade
        .venv/bin/python -m scripts.operator_db check
    - name: Seed the fictional workforce
      shell: bash
      run: .venv/bin/python -m scripts.operator_db seed
    - name: Prepare API integration tables and runtime grants
      if: inputs.test-database == 'true'
      shell: bash
      run: |
        .venv/bin/python scripts/test_db.py
        .venv/bin/python -m scripts.provision_db --test-db
    - name: Provision demo runtime grants
      if: inputs.test-database != 'true'
      shell: bash
      run: .venv/bin/python -m scripts.provision_db
