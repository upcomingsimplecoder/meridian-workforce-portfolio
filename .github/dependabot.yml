version: 2
updates:
  # Routine version bumps are reviewed deliberately. Vulnerability fixes stay enabled.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      containers-security:
        applies-to: security-updates
        patterns: ["*"]
