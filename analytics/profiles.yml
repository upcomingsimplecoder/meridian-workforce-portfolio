meridian:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('MERIDIAN_ANALYTICS_PATH', '.local/analytics.duckdb') }}"
      threads: "{{ env_var('MERIDIAN_DBT_THREADS', '2') | int }}"
      settings:
        memory_limit: "{{ env_var('MERIDIAN_DUCKDB_MEMORY_LIMIT', '256MB') }}"
