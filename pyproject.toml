[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-workforce"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0", "pydantic==2.14.0", "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.4", "alembic==1.20.0", "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0", "httpx==0.28.1", "PyJWT[crypto]==2.15.1",
  "duckdb==1.5.6", "prometheus-client==0.26.0",
  "dbt-duckdb==1.11.0",
  "opentelemetry-api==1.45.1", "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.10", "mypy==2.4.0", "uv==0.13.4", "pip-audit==2.10.1", "httpx2==2.13.1"]


[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["meridian*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/tools"]
addopts = "-ra --strict-markers"
markers = ["security: explicit security or immutable-data negative cases"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/meridian", "apps/worker"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "opentelemetry.*"]
ignore_missing_imports = true
